<script>

let codeReader = null;
let scanning = false;
let stream = null;

async function startScanner() {

  if (scanning) return;

  scanning = true;

  const status =
    document.getElementById("status");

  const video =
    document.getElementById("video");

  const barcodeInput =
    document.getElementById("barcode");

  status.innerText = "Starting camera...";

  try {

    // Stop old stream
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    // Create scanner
    if (!codeReader) {

      const hints = new Map();

      hints.set(
        ZXing.DecodeHintType.POSSIBLE_FORMATS,
        [
          ZXing.BarcodeFormat.UPC_A,
          ZXing.BarcodeFormat.UPC_E,
          ZXing.BarcodeFormat.EAN_13,
          ZXing.BarcodeFormat.EAN_8
        ]
      );

      codeReader =
        new ZXing.BrowserMultiFormatReader(hints);

    }

    // Start camera
    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        }

      });

    video.srcObject = stream;

    video.setAttribute("playsinline", true);

    await video.play();

    status.innerText = "Scanning...";

    codeReader.decodeFromVideoDevice(

      null,
      video,

      (result, err) => {

        if (!scanning) return;

        // SUCCESS
        if (result) {

          scanning = false;

          const code = result.getText();

          barcodeInput.value = code;

          status.innerText =
            "Scanned: " + code;

          console.log(result);

          // vibration
          if (navigator.vibrate) {
            navigator.vibrate(200);
          }

          // stop camera
          if (stream) {
            stream
              .getTracks()
              .forEach(track => track.stop());
          }

          codeReader.reset();

          // Send to Apps Script
          fetch(
            "https://script.google.com/macros/s/AKfycbwxT5rVFJfOn9ak4wWiwWJHxz1Kllp9Z-WsAXdyeNrlWHjiDKRNKh4qHUomPohvH2cV/exec",
            {

              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                barcode: code
              })

            }
          )

          .then(response => response.text())

          .then(data => {
            console.log(data);
          })

          .catch(error => {

            console.error(error);

            status.innerText =
              "Error sending to sheet";

          });

        }

        // Ignore normal scan misses
        if (
          err &&
          !(err instanceof ZXing.NotFoundException)
        ) {
          console.log(err);
        }

      }

    );

  }

  catch (e) {

    console.error(e);

    scanning = false;

    status.innerText =
      "Camera error: " + e.message;

  }

}

</script>

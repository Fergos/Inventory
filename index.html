<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- IMPORTANT: use stable ZXing build (NOT @latest) -->
<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>
body {
  font-family: Arial;
  margin: 0;
  padding: 10px;
  text-align: center;
}

video {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  margin-top: 10px;
  background: #4285f4;
  color: white;
  border: none;
  border-radius: 10px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
}

#status {
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>Barcode Scanner</h2>

<button onclick="startScanner()">Start Scan</button>

<video id="video"></video>

<div id="status"></div>

<input id="barcode" placeholder="Scanned barcode">

<script>

let codeReader;

function startScanner() {

  const status = document.getElementById("status");
  const video = document.getElementById("video");

  status.innerText = "Starting camera...";

  // FORCE clean init each time
  codeReader = new ZXing.BrowserMultiFormatReader();

  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => {

      video.srcObject = stream;
      video.setAttribute("playsinline", true);
      video.play();

      codeReader.decodeFromVideoDevice(
        null,
        video,
        (result, err) => {

          if (result) {

            const code = result.getText();

            document.getElementById("barcode").value = code;

            status.innerText = "Scanned: " + code;

            // stop camera
            stream.getTracks().forEach(t => t.stop());
            codeReader.reset();
          }

          if (err && !(err instanceof ZXing.NotFoundException)) {
            console.log(err);
          }
        }
      );

    })
    .catch(err => {
      console.error(err);
      status.innerText = "Camera blocked or not supported: " + err;
    });
}

</script>

</body>
</html>

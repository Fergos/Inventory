<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 10px;
  text-align: center;
}

h2 {
  margin-bottom: 15px;
}

video {
  width: 100%;
  max-height: 350px;
  border-radius: 12px;
  background: black;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #4285f4;
  color: white;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
  box-sizing: border-box;
}

#status {
  margin-top: 12px;
  font-weight: bold;
}

</style>

</head>

<body>

<h2>Inventory Barcode Scanner</h2>

<button onclick="startScanner()">
  Start Scan
</button>

<video id="video" playsinline></video>

<div id="status"></div>

<input
  id="barcode"
  placeholder="Scanned barcode">

<script>

let codeReader = null;
let controls = null;
let scanning = false;

async function startScanner() {

  if (scanning) return;

  scanning = true;

  const status =
    document.getElementById("status");

  const video =
    document.getElementById("video");

  const barcodeInput =
    document.getElementById("barcode");

  status.innerText =
    "Opening camera...";

  try {

    // stop previous scanner
    if (controls) {
      controls.stop();
    }

    // UPC focused scanner
    const hints = new Map();

    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [
        ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8
      ]
    );

    codeReader =
      new ZXing.BrowserMultiFormatReader(hints);

    controls =
      await codeReader.decodeFromConstraints(

        {
          video: {

            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }

          }
        },

        video,

        async (result, err) => {

          if (result && scanning) {

            scanning = false;

            const code =
              result.getText();

            barcodeInput.value = code;

            // STOP CAMERA
            controls.stop();

            // BEEP
            const beep =
              new Audio(
                "https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
              );

            beep.play();

            // VIBRATE
            if (navigator.vibrate) {
              navigator.vibrate(300);
            }

            status.innerText =
              "Submitting: " + code;

            try {

              // AUTO SUBMIT TO SHEET
              const response =
                await fetch(
                  "https://script.google.com/macros/s/AKfycbwxT5rVFJfOn9ak4wWiwWJHxz1Kllp9Z-WsAXdyeNrlWHjiDKRNKh4qHUomPohvH2cV/exec",
                  {
                    method: "POST",

                    headers: {
                      "Content-Type":
                        "application/json"
                    },

                    body: JSON.stringify({
                      barcode: code
                    })
                  }
                );

              const text =
                await response.text();

              status.innerText =
                "✅ Added to Inventory";

              console.log(text);

            }

            catch (submitErr) {

              console.error(submitErr);

              status.innerText =
                "❌ Failed sending to sheet";
            }

          }

          // ignore normal misses
          if (
            err &&
            !(err instanceof ZXing.NotFoundException)
          ) {
            console.log(err);
          }

        }

      );

    status.innerText =
      "Point camera at barcode";

  }

  catch (e) {

    scanning = false;

    console.error(e);

    status.innerText =
      "Camera error: " + e.message;

  }

}

</script>

</body>
</html>

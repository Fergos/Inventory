<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- IMPORTANT: use stable ZXing build (NOT @latest) -->
<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>
body {
  font-family: Arial;
  margin: 0;
  padding: 10px;
  text-align: center;
}

video {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  margin-top: 10px;
  background: #4285f4;
  color: white;
  border: none;
  border-radius: 10px;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
}

#status {
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>Barcode Scanner</h2>

<button onclick="startScanner()">Start Scan</button>

<video id="video"></video>

<div id="status"></div>

<input id="barcode" placeholder="Scanned barcode">

<script>

let codeReader;

<script>

let codeReader = null;
let stream = null;
let scanning = false;

async function startScanner() {

  const status = document.getElementById("status");
  const video = document.getElementById("video");

  status.innerText = "Starting camera...";

  try {

    // stop old stream if exists
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }

    codeReader = new ZXing.BrowserMultiFormatReader();

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;
    video.setAttribute("playsinline", true);
    await video.play();

    scanning = true;
    status.innerText = "Scanning...";

    codeReader.decodeFromVideoDevice(
      null,
      video,
      (result, err) => {

        if (!scanning) return;

        if (result) {

          scanning = false;

          const code = result.getText();

          document.getElementById("barcode").value = code;

          status.innerText = "Scanned: " + code;

          // stop camera properly
          if (stream) {
            stream.getTracks().forEach(t => t.stop());
          }

          codeReader.reset();

          sendToSheet(code);
        }

        if (err && !(err instanceof ZXing.NotFoundException)) {
          console.log(err);
        }
      }
    );

  } catch (e) {
    console.error(e);
    status.innerText = "Camera error: " + e;
  }
}

function sendToSheet(code) {

  fetch("YOUR_APPS_SCRIPT_URL_HERE", {
    method: "POST",
    body: JSON.stringify({ barcode: code }),
    headers: {
      "Content-Type": "application/json"
    }
  });

}

</script>

</script>

</body>
</html>

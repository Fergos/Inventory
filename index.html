<!DOCTYPE html>
<html>

<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <!-- ZXing Barcode Library -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 10px;
      text-align: center;
    }

    h2 {
      margin-bottom: 15px;
    }

    video {
      width: 100%;
      max-height: 350px;
      border-radius: 12px;
      background: black;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #4285f4;
      color: white;
      cursor: pointer;
    }

    button:active {
      background: #3367d6;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    #status {
      margin-top: 12px;
      font-weight: bold;
      min-height: 24px;
    }

  </style>

</head>

<body>

<h2>Household Inventory Scanner</h2>

<button onclick="startScanner()">
  Start Scan
</button>

<video id="video"></video>

<div id="status"></div>

<input
  id="barcode"
  placeholder="Scanned barcode">

<script>

let codeReader = null;
let scanning = false;
let stream = null;

async function startScanner() {

  if (scanning) return;

  scanning = true;

  const status =
    document.getElementById("status");

  const video =
    document.getElementById("video");

  const barcodeInput =
    document.getElementById("barcode");

  status.innerText = "Starting camera...";

  try {

    // stop old stream if exists
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    // initialize scanner once
    if (!codeReader) {
     const hints = new Map();

hints.set(
  ZXing.DecodeHintType.POSSIBLE_FORMATS,
  [
    ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E,
    ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.EAN_8
  ]
);

codeReader =
  new ZXing.BrowserMultiFormatReader(hints);
    // request camera
    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
  facingMode: {
    ideal: "environment"
  },

  width: {
    ideal: 1920
  },

  height: {
    ideal: 1080
  },

  focusMode: "continuous"
}

      });

    video.srcObject = stream;

    video.setAttribute("playsinline", true);

    await video.play();

    status.innerText = "Scanning...";

    codeReader.decodeFromVideoDevice(

      null,
      video,

      (result, err) => {

        if (!scanning) return;

        // barcode detected
        if (result) {

          scanning = false;

          const code = result.getText();

          barcodeInput.value = code;

          status.innerText =
            "Scanned: " + code;

          // vibration feedback
          if (navigator.vibrate) {
            navigator.vibrate(200);
          }

          // stop camera
          if (stream) {
            stream
              .getTracks()
              .forEach(track => track.stop());
          }

          codeReader.reset();

          // SEND TO APPS SCRIPT
          fetch(
           "https://script.google.com/macros/s/AKfycbwxT5rVFJfOn9ak4wWiwWJHxz1Kllp9Z-WsAXdyeNrlWHjiDKRNKh4qHUomPohvH2cV/exec",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                barcode: code
              })
            }
          )
          .then(response => response.text())
          .then(data => {
            console.log(data);
          })
          .catch(error => {
            console.error(error);
            status.innerText =
              "Error sending to sheet";
          });

        }

        // ignore normal scan misses
        if (
          err &&
          !(err instanceof ZXing.NotFoundException)
        ) {
          console.log(err);
        }

      }

    );

  } catch (e) {

    console.error(e);

    scanning = false;

    status.innerText =
      "Camera error: " + e.message;
  }
}

</script>

</body>
</html>

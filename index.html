<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ZXing barcode library -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@latest"></script>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      padding: 10px;
      text-align: center;
      background: #f4f4f4;
    }

    video {
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #4285f4;
      color: white;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>Barcode Scanner</h2>

<button onclick="startScanner()">Start Scan</button>

<video id="video"></video>

<div id="status"></div>

<input id="barcode" placeholder="Scanned barcode">

<script>

let codeReader = null;

function startScanner() {

  const status = document.getElementById("status");
  const video = document.getElementById("video");
  const barcodeInput = document.getElementById("barcode");

  status.innerText = "Starting camera...";

  if (!codeReader) {
    codeReader = new ZXing.BrowserMultiFormatReader();
  }

  video.setAttribute("playsinline", true);

  codeReader.decodeFromVideoDevice(
    null,
    video,
    (result, err) => {

      if (result) {

        const code = result.getText();

        barcodeInput.value = code;

        status.innerText = "Scanned: " + code;

        // Send to Google Apps Script
        fetch("https://script.google.com/macros/s/AKfycbwxT5rVFJfOn9ak4wWiwWJHxz1Kllp9Z-WsAXdyeNrlWHjiDKRNKh4qHUomPohvH2cV/exec", {
          method: "POST",
          body: JSON.stringify({ barcode: code }),
          headers: {
            "Content-Type": "application/json"
          }
        });

        codeReader.reset();
      }

      if (err && !(err instanceof ZXing.NotFoundException)) {
        console.log(err);
      }
    }
  );
}

</script>

</body>
</html>

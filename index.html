<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
  padding: 10px;
  text-align: center;
}

h2 {
  margin-bottom: 15px;
}

video {
  width: 100%;
  max-height: 350px;
  border-radius: 12px;
  background: black;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  margin-top: 10px;
  border: none;
  border-radius: 10px;
  background: #4285f4;
  color: white;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
  box-sizing: border-box;
}

#status {
  margin-top: 12px;
  font-weight: bold;
}

</style>

</head>

<body>

<h2>Inventory Barcode Scanner</h2>

<button onclick="startScanner()">
  Start Scan
</button>

<video id="video" playsinline></video>

<div id="status"></div>

<input
  id="barcode"
  placeholder="Scanned barcode">

<script>

let codeReader;
let controls;

async function startScanner() {

  const status =
    document.getElementById("status");

  const video =
    document.getElementById("video");

  const barcodeInput =
    document.getElementById("barcode");

  status.innerText = "Opening camera...";

  try {

    // reset previous scanner
    if (controls) {
      controls.stop();
    }

    codeReader =
      new ZXing.BrowserMultiFormatReader();

    // list cameras
    const devices =
      await ZXing.BrowserCodeReader
        .listVideoInputDevices();

    if (devices.length === 0) {

      status.innerText =
        "No camera found";

      return;
    }

    // prefer rear camera
    let selectedDeviceId =
      devices[0].deviceId;

    devices.forEach(device => {

      const label =
        device.label.toLowerCase();

      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {
        selectedDeviceId = device.deviceId;
      }

    });

    status.innerText = "Scanning UPC...";

    controls =
      await codeReader.decodeFromVideoDevice(

        selectedDeviceId,

        video,

        (result, err) => {

          // SUCCESS
          if (result) {

            const code =
              result.getText();

            barcodeInput.value = code;

            status.innerText =
              "Scanned: " + code;

            // vibration
            if (navigator.vibrate) {
              navigator.vibrate(200);
            }

            // STOP CAMERA
            controls.stop();

            // SEND TO GOOGLE SCRIPT
            fetch(
              "https://script.google.com/macros/s/AKfycbwxT5rVFJfOn9ak4wWiwWJHxz1Kllp9Z-WsAXdyeNrlWHjiDKRNKh4qHUomPohvH2cV/exec",
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json"
                },

                body: JSON.stringify({
                  barcode: code
                })
              }
            );

          }

          // ignore normal scan failures
          if (
            err &&
            !(err instanceof ZXing.NotFoundException)
          ) {
            console.log(err);
          }

        }

      );

  }

  catch (e) {

    console.error(e);

    status.innerText =
      "Camera error: " + e.message;

  }

}

</script>

</body>
</html>
